name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Dry run: build and sign, but skip commit/tag/push/publish. Uploads the APK as a workflow artifact instead. Can be run from any branch."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main' && !inputs.dry_run
        run: |
          set -euo pipefail
          echo "::error::Releases can only be dispatched from main (got ${GITHUB_REF}). Use dry_run to test from another branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(grep -m1 '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          bash scripts/bump-version.sh "$current" "$BUMP" > /tmp/version.env
          cat /tmp/version.env >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC1091
          source /tmp/version.env
          if git rev-parse -q --verify "refs/tags/${VERSION_NAME}" >/dev/null; then
            echo "::error::Tag ${VERSION_NAME} already exists"
            exit 1
          fi

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.VERSION_NAME }} --strip all -o RELEASE_NOTES.md

      - name: Update gradle.properties
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION_NAME}/" gradle.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${VERSION_CODE}/" gradle.properties
          grep -q "^VERSION_NAME=${VERSION_NAME}$" gradle.properties
          grep -q "^VERSION_CODE=${VERSION_CODE}$" gradle.properties

      - name: Write fastlane changelog (en-US)
        env:
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/metadata/android/en-US/changelogs
          dest="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          # F-Droid renders this as plain text: drop the markdown heading markers and
          # blank lines, keeping "Features" as a bare label above its bullets.
          sed -e 's/^### //' -e '/^[[:space:]]*$/d' RELEASE_NOTES.md > "$dest"

          # F-Droid and Play both reject changelogs over 500 characters. Cut at a line
          # boundary rather than mid-word, and warn instead of failing the release.
          if [ "$(wc -c < "$dest")" -gt 500 ]; then
            head -c 500 "$dest" | sed '$d' > "$dest.tmp" && mv "$dest.tmp" "$dest"
            echo "::warning::changelog truncated to 500 chars for ${VERSION_CODE}; review $dest"
          fi

      - name: Commit and tag (local only — not pushed yet)
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          # Committing and tagging before the build (rather than after) means HEAD is the exact
          # commit the tag points to when assembleRelease runs below, so the git revision AGP
          # embeds in META-INF/version-control-info.textproto matches what F-Droid's rebuild sees
          # when it checks out this tag. Nothing is pushed here — see "Push commit and tag" below,
          # which only runs after a successful build, so a failed build still leaves main untouched.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          git commit -m "build: release ${VERSION_NAME}"
          git tag -a "${VERSION_NAME}" -m "Release ${VERSION_NAME}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Both tasks in one invocation: they share the same R8 task for the release build type,
        # so the APK (GitHub/F-Droid) and the AAB (Play) come from a single minification pass
        # and the mapping file below applies to both.
        run: ./gradlew assembleRelease bundleRelease

      - name: Rename artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          apk_src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_src" ]; then
            echo "::error::Expected signed APK at ${apk_src} (build produced an unsigned APK — check the KEYSTORE_* secrets)"
            exit 1
          fi
          cp "$apk_src" "CairnGPS-${VERSION_NAME}.apk"

          # Unlike the APK, an unsigned bundle keeps the same file name, so the signing check is the
          # APK one above: both come from the same signingConfig.
          aab_src="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$aab_src" ]; then
            echo "::error::Expected release AAB at ${aab_src}"
            exit 1
          fi
          cp "$aab_src" "CairnGPS-${VERSION_NAME}.aab"

          mapping_src="app/build/outputs/mapping/release/mapping.txt"
          if [ ! -f "$mapping_src" ]; then
            echo "::error::Expected R8 mapping file at ${mapping_src}"
            exit 1
          fi
          cp "$mapping_src" "mapping-${VERSION_NAME}.txt"

      - name: Upload dry-run artifacts
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-${{ steps.version.outputs.VERSION_NAME }}
          path: |
            CairnGPS-${{ steps.version.outputs.VERSION_NAME }}.apk
            CairnGPS-${{ steps.version.outputs.VERSION_NAME }}.aab
            mapping-${{ steps.version.outputs.VERSION_NAME }}.txt
            RELEASE_NOTES.md
            fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.VERSION_CODE }}.txt
          retention-days: 14

      # The AAB is signed with the upload key and is only usable by Play Console, so it is kept as a
      # workflow artifact rather than attached to the public GitHub release (where users would
      # download a file they cannot install).
      - name: Upload Play bundle
        if: "!inputs.dry_run"
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ steps.version.outputs.VERSION_NAME }}
          path: |
            CairnGPS-${{ steps.version.outputs.VERSION_NAME }}.aab
            mapping-${{ steps.version.outputs.VERSION_NAME }}.txt
          retention-days: 90

      - name: Dry-run summary
        if: inputs.dry_run
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing was pushed, tagged remotely or published"
            echo "Would have released **${VERSION_NAME}** (versionCode ${VERSION_CODE})."
            echo "APK, Play AAB, mapping file, release notes and the draft changelog are attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push commit and tag
        if: "!inputs.dry_run"
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "refs/tags/${VERSION_NAME}"

      - name: Publish GitHub release
        if: "!inputs.dry_run"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          gh release create "${VERSION_NAME}" \
            --title "${VERSION_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "CairnGPS-${VERSION_NAME}.apk" \
            "mapping-${VERSION_NAME}.txt"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"
